<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ruleta Ayllucraft</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            background-color: #09090b; 
            color: white; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        .zona-ruleta {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #27272a 0%, #09090b 100%);
            padding: 20px;
        }

        .ruleta-container {
            position: relative;
            aspect-ratio: 1 / 1;
            height: 95vh; 
            max-height: 800px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img-fondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            z-index: 1;
        }

        .img-giratoria {
            /* IMPORTANTE: Ajusta este 75% a 80% o 70% si notas que 
               tu círculo de la ruleta queda muy grande o chico respecto al fondo */
            width: 75%; 
            position: relative;
            z-index: 2;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .panel-control { width: 380px; background: #18181b; border-left: 2px solid #3f3f46; padding: 25px; display: flex; flex-direction: column; box-shadow: -10px 0 20px rgba(0,0,0,0.3); z-index: 10; }
        .panel-control h2 { margin-bottom: 20px; color: #facc15; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 2px solid #3f3f46; background: #27272a; color: white; font-family: 'Poppins', sans-serif; outline: none; }
        input:focus { border-color: #8b5cf6; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-agregar { background-color: #7c3aed; color: white; margin-bottom: 20px; }
        .btn-agregar:hover { background-color: #6d28d9; }
        .btn-girar { background-color: #10b981; color: white; font-size: 1.2em; padding: 15px; margin-top: 20px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
        .btn-girar:hover { background-color: #059669; transform: translateY(-2px); }
        .btn-girar:disabled { background-color: #3f3f46; cursor: not-allowed; box-shadow: none; transform: none; }
        .lista-contenedor { flex: 1; overflow-y: auto; padding-right: 5px; }
        .lista-contenedor::-webkit-scrollbar { width: 6px; }
        .lista-contenedor::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ul { list-style: none; }
        li { background: #27272a; margin-bottom: 8px; padding: 10px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #facc15; font-size: 0.95em; }
        .btn-eliminar { background: #ef4444; color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.8em; }
        .btn-eliminar:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="zona-ruleta">
        <div class="ruleta-container">
            <!-- Referencia directa a tus imágenes separadas -->
            <img class="img-fondo" src="fondo.jpg" alt="Fondo">
            <img id="ruleta" class="img-giratoria" src="ruleta.png" alt="Ruleta">
        </div>
    </div>

    <div class="panel-control">
        <h2>Participantes</h2>
        <input type="text" id="nombreInput" placeholder="Ingresa un nombre y presiona Enter" autocomplete="off">
        <button class="btn-agregar" onclick="agregarNombre()">Agregar Jugador</button>
        
        <div class="lista-contenedor">
            <ul id="listaParticipantes"></ul>
        </div>

        <button id="btn-girar" class="btn-girar" onclick="girarRuleta()">¡GIRAR RULETA!</button>
    </div>

    <script>
        let participantes = [];
        let rotacionActual = 0;

        document.getElementById("nombreInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") agregarNombre();
        });

        function agregarNombre() {
            const input = document.getElementById('nombreInput');
            const nombre = input.value.trim();
            if (nombre && !participantes.includes(nombre)) {
                participantes.push(nombre);
                input.value = '';
                actualizarLista();
            }
        }

        function actualizarLista() {
            const ul = document.getElementById('listaParticipantes');
            ul.innerHTML = '';
            participantes.forEach((nombre, index) => {
                ul.innerHTML += `<li>${nombre} <span class="btn-eliminar" onclick="eliminarNombre(${index})">X</span></li>`;
            });
        }

        function eliminarNombre(index) {
            participantes.splice(index, 1);
            actualizarLista();
        }

        function girarRuleta() {
            if (participantes.length === 0) {
                Swal.fire({
                    title: '¡Espera!',
                    text: 'Agrega al menos un participante para girar.',
                    icon: 'warning',
                    background: '#18181b',
                    color: '#fff'
                });
                return;
            }

            const indiceGanador = Math.floor(Math.random() * participantes.length);
            const ganador = participantes[indiceGanador];

            const gradosExtra = Math.floor(Math.random() * 360);
            rotacionActual += 1800 + gradosExtra; 
            
            const ruletaImg = document.getElementById('ruleta');
            const btnGirar = document.getElementById('btn-girar');
            
            btnGirar.disabled = true;
            btnGirar.innerText = 'GIRANDO...';
            ruletaImg.style.transform = `rotate(${rotacionActual}deg)`;

            setTimeout(() => {
                Swal.fire({
                    title: '¡TENEMOS UN GANADOR!',
                    html: `<b>${ganador}</b> se lleva el premio que marca la ruleta.`,
                    icon: 'success',
                    background: '#18181b',
                    color: '#fff',
                    confirmButtonColor: '#10b981'
                });

                eliminarNombre(indiceGanador);
                btnGirar.disabled = false;
                btnGirar.innerText = '¡GIRAR RULETA!';
                
            }, 4000); 
        }
    </script>
</body>
</html>
